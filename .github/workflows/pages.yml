name: build-demo-artifact

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEMO_REPO_TOKEN: ${{ secrets.DEMO_REPO_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore OneVision.UI.sln

      - name: Publish gallery
        run: dotnet publish demo/OneVision.UI.Demo/OneVision.UI.Demo.csproj -c Release --no-restore -o release

      - name: Prepare public demo paths
        shell: bash
        run: |
          sed -i 's|<base href="/" />|<base href="/OneVision.UI.Demo/" />|' release/wwwroot/index.html
          cp release/wwwroot/index.html release/wwwroot/404.html
          touch release/wwwroot/.nojekyll

      - name: Upload compiled demo
        uses: actions/upload-artifact@v4
        with:
          name: onevision-ui-demo
          path: release/wwwroot
          if-no-files-found: error
          retention-days: 7

      - name: Publish compiled gallery to public host
        if: ${{ env.DEMO_REPO_TOKEN != '' }}
        shell: bash
        run: |
          git clone "https://x-access-token:${DEMO_REPO_TOKEN}@github.com/kingcheesezombie/OneVision.UI.Demo.git" public-demo
          rm -rf public-demo/site
          mkdir -p public-demo/site
          cp -a release/wwwroot/. public-demo/site/
          cd public-demo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "No compiled demo changes to publish."
          else
            git commit -m "Publish OneVision.UI demo ${GITHUB_SHA}"
            git push origin main
          fi
