name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore OneVision.UI.sln
      - name: Build
        run: dotnet build OneVision.UI.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/OneVision.UI.Tests/OneVision.UI.Tests.csproj -c Release --no-build --no-restore
      - name: Pack OneVision.UI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet pack src/OneVision.UI/OneVision.UI.csproj -c Release --no-build -o ./packages
      - name: Publish OneVision.UI package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet nuget push "./packages/*.nupkg" --source "https://nuget.pkg.github.com/kingcheesezombie/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
