name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore OneVision.UI.sln
      - name: Build
        run: dotnet build OneVision.UI.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/OneVision.UI.Tests/OneVision.UI.Tests.csproj -c Release --no-build --no-restore
      - name: Package
        if: github.event_name == 'push'
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          dotnet pack src/OneVision.UI/OneVision.UI.csproj \
            -c Release \
            --no-build \
            -p:PackageVersion="0.1.0-${short_sha}" \
            -o ./artifacts
      - name: Publish package to GitHub Packages
        if: github.event_name == 'push'
        run: dotnet nuget push "./artifacts/*.nupkg" --source "https://nuget.pkg.github.com/kingcheesezombie/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
