name: build-demo-artifact

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: onevision-ui-demo-publish
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEMO_REPO_TOKEN: ${{ secrets.DEMO_REPO_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore OneVision.UI.sln

      - name: Publish gallery
        run: dotnet publish demo/OneVision.UI.Demo/OneVision.UI.Demo.csproj -c Release --no-restore -o release

      - name: Prepare public demo paths
        shell: bash
        run: |
          sed -i 's|<base href="/" />|<base href="/OneVision.UI.Demo/" />|' release/wwwroot/index.html
          cp release/wwwroot/index.html release/wwwroot/404.html
          touch release/wwwroot/.nojekyll

      - name: Upload compiled demo
        uses: actions/upload-artifact@v4
        with:
          name: onevision-ui-demo
          path: release/wwwroot
          if-no-files-found: error
          retention-days: 7

      - name: Publish compiled gallery to public host
        if: ${{ env.DEMO_REPO_TOKEN != '' }}
        shell: bash
        run: |
          git clone "https://x-access-token:${DEMO_REPO_TOKEN}@github.com/kingcheesezombie/OneVision.UI.Demo.git" public-demo
          cd public-demo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            rm -rf docs
            mkdir -p docs
            cp -a ../release/wwwroot/. docs/
            git add docs

            if git diff --cached --quiet; then
              echo "No compiled demo changes to publish."
              exit 0
            fi

            git commit -m "Publish OneVision.UI demo ${GITHUB_SHA}"

            if git push origin main; then
              exit 0
            fi

            echo "Public demo changed during publish; retrying against latest main..."
            sleep 2
          done

          echo "Unable to publish compiled demo after 3 attempts."
          exit 1
